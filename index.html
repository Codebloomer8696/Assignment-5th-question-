<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of Lists</title>
</head>
<body>

<!--Unordered List-->

    <h3>Unordered</h3>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    
    <!--Ordered List-->

    <h3>Ordered</h3>
    <ol type="A">
        <li>Install VS Code</li>
        <li>Create file</li>
        <li>Open in browser</li>
    </ol>

    <!--Description List-->

    <h3>Description</h3>
    <dl>
        <dt>HTML</dt>
        <dd> Hyper Text Markup Language</dd>

        <dt>CSS</dt>
       <dd>Cascading Style sheets</dd>
    </dl>

    <hr>

        </tr>

        </tr>

        <tr>

            <th>Codebloomer8696</th>
        </tr>
    </table>
    
</body>
</html>
